name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Prevent overlapping runs — queue instead of cancel so no release is skipped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Skip lint+build+release when the CI itself pushed a chore(release) commit —
    # those commits have no releasable changes and would re-trigger the full pipeline.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            artifact: windows-x64-build
          - os: ubuntu-latest
            platform: Linux
            arch: x64
            artifact: linux-x64-build
          # NOTE: Windows arm64 (windows-11-arm) and Linux arm64 (ubuntu-24.04-arm)
          # are excluded — Flutter SDK doesn't publish arm64 CI binaries yet.
          # ARM64 users can build from source: flutter build linux/windows --release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        if: matrix.platform == 'Windows'
        run: flutter build windows --release

      - name: Build Linux executable
        if: matrix.platform == 'Linux'
        run: flutter build linux --release


      - name: Package AppImage
        if: matrix.platform == 'Linux'
        run: |
          # Prepare AppImage directory
          mkdir -p AppDir
          cp -r build/linux/${{ matrix.arch }}/release/bundle/* AppDir/
          cp packaging/linux/AppRun AppDir/
          cp packaging/linux/command_center.desktop AppDir/
          cp assets/images/runescape_icon.png AppDir/command_center.png
          chmod +x AppDir/AppRun

          # Download appimagetool for the build host architecture
          ARCH=$(uname -m)
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x "appimagetool-${ARCH}.AppImage"

          # Build AppImage (--appimage-extract-and-run avoids FUSE requirement in CI)
          "./appimagetool-${ARCH}.AppImage" AppDir --appimage-extract-and-run
          mv Command_Center-*.AppImage "command-center-${{ matrix.arch }}.AppImage"

      - name: Upload Windows artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/windows/x64/runner/Release/**/*

      - name: Upload Linux artifact
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: command-center-${{ matrix.arch }}.AppImage

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version
        run: |
          NEW_VERSION=$(bash scripts/release/version.sh --dry-run 2>/dev/null) || true
          if [[ -z "$NEW_VERSION" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commits — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Will release v${NEW_VERSION}"
          fi

      - name: Bump version in pubspec.yaml
        if: steps.version.outputs.skip == 'false'
        run: bash scripts/release/version.sh

      - name: Generate changelog
        if: steps.version.outputs.skip == 'false'
        id: changelog
        run: |
          BODY=$(bash scripts/release/changelog.sh "${{ steps.version.outputs.new_version }}")
          echo "$BODY" > /tmp/release_body.md

      - name: Commit version bump and changelog
        if: steps.version.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          # Force-create tag (handles re-runs where tag exists from a previous failed attempt)
          git tag -fa "v${{ steps.version.outputs.new_version }}" -m "v${{ steps.version.outputs.new_version }}"
          # Push commit and tag atomically so no CI run sees the commit without its tag.
          git push origin main "v${{ steps.version.outputs.new_version }}" --force

      - name: Download all build artifacts
        if: steps.version.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Package release files
        if: steps.version.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Zip Windows x64
          cd release-artifacts/windows-x64-build
          zip -r "../../command-center-v${VERSION}-windows.zip" .
          cd ../..

          # Rename Linux AppImage
          mv release-artifacts/linux-x64-build/command-center-x64.AppImage "command-center-v${VERSION}-linux.AppImage"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          name: "v${{ steps.version.outputs.new_version }}"
          body_path: /tmp/release_body.md
          files: |
            command-center-v${{ steps.version.outputs.new_version }}-windows.zip
            command-center-v${{ steps.version.outputs.new_version }}-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
