name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate conventional commits
        run: |
          # Only lint commits from the push that triggered this workflow
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial push or no previous commit, skipping commit lint"
            exit 0
          fi

          INVALID=0
          while IFS= read -r msg; do
            if [[ -z "$msg" ]]; then continue; fi
            # Allow merge commits
            if echo "$msg" | grep -qE "^Merge "; then continue; fi
            if ! echo "$msg" | grep -qE "^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\(.+\))?(!)?: .+"; then
              echo "Invalid commit message: $msg"
              INVALID=$((INVALID + 1))
            fi
          done <<< "$(git log "${BEFORE}..${AFTER}" --pretty=format:"%s")"

          if [[ $INVALID -gt 0 ]]; then
            echo ""
            echo "Found $INVALID non-conventional commit(s)."
            echo "Format: <type>(<scope>): <description>"
            echo "Types: feat, fix, chore, docs, style, refactor, perf, test, ci, build, revert"
            exit 1
          fi
          echo "All commits follow conventional format"

  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: lint-commits
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [lint-commits, lint]
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            artifact: windows-build
          - os: ubuntu-latest
            platform: Linux
            artifact: linux-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows executable
        if: matrix.platform == 'Windows'
        run: flutter build windows --release

      - name: Build Linux executable
        if: matrix.platform == 'Linux'
        run: flutter build linux --release

      - name: Package AppImage
        if: matrix.platform == 'Linux'
        run: |
          # Prepare AppImage directory
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/* AppDir/
          cp packaging/linux/AppRun AppDir/
          cp packaging/linux/command_center.desktop AppDir/
          cp assets/images/runescape_icon.png AppDir/command_center.png
          chmod +x AppDir/AppRun

          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Build AppImage (--appimage-extract-and-run avoids FUSE requirement in CI)
          ./appimagetool-x86_64.AppImage AppDir --appimage-extract-and-run
          mv Command_Center-x86_64.AppImage command-center.AppImage

      - name: Upload Windows artifact
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/windows/x64/runner/Release/**/*

      - name: Upload Linux artifact
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: command-center.AppImage

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version
        run: |
          NEW_VERSION=$(bash scripts/release/version.sh --dry-run 2>/dev/null) || true
          if [[ -z "$NEW_VERSION" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No releasable commits — skipping release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Will release v${NEW_VERSION}"
          fi

      - name: Bump version in pubspec.yaml
        if: steps.version.outputs.skip == 'false'
        run: bash scripts/release/version.sh

      - name: Generate changelog
        if: steps.version.outputs.skip == 'false'
        id: changelog
        run: |
          BODY=$(bash scripts/release/changelog.sh "${{ steps.version.outputs.new_version }}")
          echo "$BODY" > /tmp/release_body.md

      - name: Commit version bump and changelog
        if: steps.version.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "v${{ steps.version.outputs.new_version }}"
          git push origin main --follow-tags

      - name: Download Windows build
        if: steps.version.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-windows/

      - name: Download Linux build
        if: steps.version.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-linux/

      - name: Zip Windows artifact
        if: steps.version.outputs.skip == 'false'
        run: |
          cd release-windows
          zip -r "../command-center-v${{ steps.version.outputs.new_version }}-windows.zip" .

      - name: Rename Linux artifact
        if: steps.version.outputs.skip == 'false'
        run: |
          mv release-linux/command-center.AppImage "command-center-v${{ steps.version.outputs.new_version }}-linux.AppImage"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          name: "v${{ steps.version.outputs.new_version }}"
          body_path: /tmp/release_body.md
          files: |
            command-center-v${{ steps.version.outputs.new_version }}-windows.zip
            command-center-v${{ steps.version.outputs.new_version }}-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
