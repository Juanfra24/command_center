name: command_center
description: "Command center of my bots"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 0.6.0

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
    flutter:
      sdk: flutter
    flutter_localizations:
      sdk: flutter
    connectivity_plus: ^7.0.0
    flutter_screenutil: ^5.9.0
    get: ^4.6.5
    get_it: ^9.2.0
    get_storage: ^2.0.3
    logger: ^2.6.2
    url_launcher: ^6.1.14
    # Pinned: 4.14+ removes PaneDisplayMode.open and NavigationAppBar (breaking).
    # Upgrading requires refactoring lib/feature/app.dart navigation code.
    fluent_ui: 4.13.0
    system_theme: ^3.1.2
    equatable: ^2.0.5
    audioplayers: ^6.0.0
    window_manager: ^0.5.1
    intl: ^0.20.2
    http: ^1.2.0
    shared_preferences: ^2.2.2
    # Drift ORM for SQLite
    drift: ^2.22.1
    sqlite3_flutter_libs: ^0.5.28
    path_provider: ^2.1.5
    path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Drift code generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.15


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/music/

